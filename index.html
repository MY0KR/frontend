<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AzU Sci - Student Patrol</title>
  
  <!-- Google Fonts for Hand-drawn / Sketch / Crayon styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Finger+Paint&family=Permanent+Marker&family=Cabin+Sketch:wght@700&family=Caveat:wght@700&family=Gochi+Hand&family=Patrick+Hand&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      font-family: 'Finger Paint', 'Permanent Marker', 'Gochi Hand', cursive, sans-serif;
      position: relative;
      background-image: radial-gradient(#d1d1d1 0.75px, transparent 0.75px);
      background-size: 24px 24px;
    }

    /* Sketch SVG Filter for Charcoal / Crayon Texture */
    .sketch-effect {
      filter: url(#rough-filter);
    }

    /* Layout Wrapper */
    .canvas-container {
      max-width: 1400px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 20px 40px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Header Section (AzU Sci at Top Right) */
    .header-section {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      padding-top: 10px;
      padding-bottom: 15px;
      padding-right: 20px;
    }

    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: relative;
    }

    .brand-top-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-azu {
      font-size: 3.8rem;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 2px;
      color: #000;
      transform: rotate(-1deg);
      text-shadow: 1px 1px 0px #333, -0.5px -0.5px 0px #000;
    }

    .brand-logo-circle {
      width: 68px;
      height: 68px;
      border: 4px solid #000;
      border-radius: 50% 46% 52% 48% / 48% 52% 48% 52%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: rotate(4deg);
      position: relative;
      box-shadow: 0 0 0 1px #000;
    }

    .logo-inner-text {
      font-size: 1.1rem;
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.5px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-inner-text span:first-child {
      font-size: 1.1rem;
      border-bottom: 2px solid #000;
      padding-bottom: 1px;
    }
    .logo-inner-text span:last-child {
      font-size: 1.1rem;
      padding-top: 1px;
    }

    .brand-sci {
      font-size: 3.6rem;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 1px;
      margin-top: 2px;
      transform: rotate(1deg);
      text-shadow: 1px 1px 0px #333;
    }

    /* Hand-drawn Divider Line across the screen */
    .sketch-divider {
      width: 100%;
      height: 18px;
      margin-top: 5px;
      margin-bottom: 40px;
    }

    /* Main Body Grid */
    .main-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      align-items: center;
      gap: 40px;
      padding: 10px 20px 40px 20px;
    }

    /* Left Hand-written Typography */
    .sketch-text-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sketch-line {
      font-size: 4.8rem;
      font-weight: 900;
      line-height: 1.12;
      letter-spacing: 1px;
      color: #000000;
      transform-origin: left center;
      display: block;
      text-shadow: 1px 1px 0px rgba(0,0,0,0.8), -0.5px -0.5px 0px rgba(0,0,0,0.9);
    }

    .line-welcome {
      transform: rotate(-1.5deg);
      font-size: 4.6rem;
    }

    .line-to {
      transform: rotate(1deg);
      font-size: 4.4rem;
      margin-left: 10px;
    }

    .line-azuscince {
      transform: rotate(-0.5deg);
      font-size: 5rem;
      letter-spacing: 2px;
      margin-top: -4px;
    }

    .line-student {
      transform: rotate(1.5deg);
      font-size: 4.8rem;
      margin-left: 12px;
      margin-top: 4px;
    }

    .line-patrol {
      transform: rotate(-1deg);
      font-size: 5rem;
      letter-spacing: 3px;
      margin-top: 4px;
    }

    /* Right Action Column with Hand-drawn Clickable Arrow */
    .sketch-action-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .arrow-button {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 20px;
      outline: none;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .arrow-button:hover {
      transform: scale(1.08) translateX(12px);
    }

    .arrow-button:active {
      transform: scale(0.96) translateX(16px);
    }

    .arrow-svg {
      width: 320px;
      max-width: 100%;
      height: auto;
      filter: drop-shadow(2px 3px 0px rgba(0,0,0,0.3));
    }

    .arrow-hint {
      font-family: 'Caveat', 'Gochi Hand', cursive;
      font-size: 1.8rem;
      color: #333;
      transform: rotate(-3deg);
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    .arrow-button:hover .arrow-hint {
      opacity: 1;
      color: #000;
      font-weight: bold;
    }

    /* Interactive Hand-Drawn Sketch Modal (Opens when arrow is clicked) */
    .sketch-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .sketch-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .sketch-modal {
      background: #ffffff;
      border: 5px solid #000000;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      max-width: 540px;
      width: 100%;
      padding: 35px 30px;
      box-shadow: 12px 14px 0px #000000;
      position: relative;
      transform: rotate(-1deg) scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .sketch-modal-overlay.active .sketch-modal {
      transform: rotate(-0.5deg) scale(1);
    }

    .modal-close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 2.2rem;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Permanent Marker', cursive;
      color: #000;
      line-height: 1;
      transition: transform 0.15s;
    }
    .modal-close-btn:hover {
      transform: scale(1.3) rotate(10deg);
    }

    .modal-title {
      font-size: 2.3rem;
      font-family: 'Permanent Marker', cursive;
      margin-bottom: 8px;
      color: #000;
      text-align: center;
    }

    .modal-subtitle {
      font-family: 'Caveat', 'Cairo', cursive;
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 25px;
      color: #444;
    }

    .sketch-input-group {
      margin-bottom: 18px;
      text-align: right;
    }

    .sketch-label {
      display: block;
      font-family: 'Cairo', 'Gochi Hand', cursive;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #111;
    }

    .sketch-input {
      width: 100%;
      padding: 12px 16px;
      font-family: 'Finger Paint', 'Cairo', cursive;
      font-size: 1.1rem;
      border: 3px solid #000;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      outline: none;
      background: #fafafa;
      box-shadow: 4px 4px 0px #000;
      transition: all 0.2s;
    }

    .sketch-input:focus {
      background: #fff;
      box-shadow: 6px 6px 0px #000;
      transform: translate(-2px, -2px);
    }

    .sketch-submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      background: #000000;
      color: #ffffff;
      font-family: 'Permanent Marker', 'Cairo', cursive;
      font-size: 1.6rem;
      border: 3px solid #000;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      cursor: pointer;
      box-shadow: 5px 6px 0px #555;
      transition: all 0.2s;
    }

    .sketch-submit-btn:hover {
      background: #222;
      transform: translate(-3px, -3px);
      box-shadow: 8px 9px 0px #000;
    }

    .sketch-quick-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 3px dashed #000;
    }

    .sketch-pill {
      padding: 8px 12px;
      border: 2px solid #000;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      background: #f4f4f4;
      font-family: 'Cairo', cursive;
      font-size: 0.95rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .sketch-pill:hover {
      background: #000;
      color: #fff;
      transform: scale(1.04);
    }

    /* Floating control to toggle doodle sound / theme */
    .top-toolbar {
      position: fixed;
      bottom: 20px;
      left: 20px;
      display: flex;
      gap: 12px;
      z-index: 100;
    }

    .toolbar-btn {
      background: #fff;
      border: 3px solid #000;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      padding: 8px 14px;
      font-family: 'Permanent Marker', cursive;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 3px 3px 0px #000;
      transition: all 0.15s;
    }
    .toolbar-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px #000;
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 30px;
      }
      .sketch-text-column {
        align-items: center;
      }
      .sketch-line {
        font-size: 3.4rem;
      }
      .line-welcome { font-size: 3.2rem; }
      .line-to { font-size: 3rem; }
      .line-azuscince { font-size: 3.5rem; }
      .line-student { font-size: 3.4rem; }
      .line-patrol { font-size: 3.5rem; }
      .brand-azu { font-size: 2.8rem; }
      .brand-sci { font-size: 2.6rem; }
      .brand-logo-circle { width: 54px; height: 54px; }
      .arrow-svg { width: 220px; }
    }
  </style>
</head>
<body class="sketch-effect">

  <!-- SVG Filter to create real rough charcoal / crayon texture on all elements -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
    <defs>
      <filter id="rough-filter" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.4" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="canvas-container">
    
    <!-- TOP RIGHT: AzU Sci + Round Logo (EXACTLY AS IN THE SKETCH) -->
    <header class="header-section">
      <div class="brand-container">
        
        <div class="brand-top-row">
          <div class="brand-azu">AzU</div>
          
          <!-- Round Logo Stamp with AzU inside -->
          <div class="brand-logo-circle">
            <div class="logo-inner-text">
              <span>Az</span>
              <span>U</span>
            </div>
          </div>
        </div>

        <div class="brand-sci">Sci</div>

      </div>
    </header>

    <!-- HORIZONTAL SKETCH DIVIDER LINE (EXACTLY AS IN THE SKETCH) -->
    <svg class="sketch-divider" viewBox="0 0 1200 24" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <!-- Rough hand-drawn multi-stroke line across the page -->
      <path d="M 0 12 Q 150 7, 320 14 T 680 9 T 950 15 T 1200 11" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 5 14 Q 220 10, 480 15 T 820 11 T 1195 13" stroke="#000000" stroke-width="3" opacity="0.75" stroke-linecap="round"/>
    </svg>

    <!-- MAIN BODY: Left Handwritten Text + Right Arrow (EXACTLY AS IN THE SKETCH) -->
    <main class="main-grid">
      
      <!-- Left Column: The handwritten text -->
      <div class="sketch-text-column">
        <span class="sketch-line line-welcome">Welcome</span>
        <span class="sketch-line line-to">to</span>
        <span class="sketch-line line-azuscince">AZUScince</span>
        <span class="sketch-line line-student">student</span>
        <span class="sketch-line line-patrol">patrol</span>
      </div>

      <!-- Right Column: The hand-drawn arrow (Clickable & Interactive) -->
      <div class="sketch-action-column">
        
        <button class="arrow-button" onclick="openSketchModal()" title="انقر للدخول إلى البوابة">
          
          <!-- Hand-drawn SVG Arrow pointing right -->
          <svg class="arrow-svg" viewBox="0 0 360 180" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Arrow stem / shaft with crayon-like multi-stroke jitter -->
            <path d="M 20 105 Q 80 102, 160 108 T 290 102" stroke="#000000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 25 107 Q 110 104, 200 106 T 285 104" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
            
            <!-- Arrow top wing / barb -->
            <path d="M 220 50 Q 255 75, 298 103" stroke="#000000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 225 54 Q 260 78, 295 101" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
            
            <!-- Arrow bottom wing / barb -->
            <path d="M 235 155 Q 265 132, 298 103" stroke="#000000" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 238 150 Q 268 128, 295 105" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
            
            <!-- Charcoal scatter dots -->
            <circle cx="215" cy="46" r="2.5" fill="#000"/>
            <circle cx="230" cy="160" r="2.5" fill="#000"/>
            <circle cx="18" cy="107" r="2" fill="#000"/>
          </svg>

          <span class="arrow-hint"> Click to Enter Portal / انقر للدخول</span>
        </button>

      </div>

    </main>

  </div>

  <!-- Interactive Hand-Drawn Sketch Modal (Student Portal Login) -->
  <div id="sketchModal" class="sketch-modal-overlay" onclick="handleOverlayClick(event)">
    <div class="sketch-modal">
      
      <button class="modal-close-btn" onclick="closeSketchModal()">✕</button>

      <div class="modal-title">AzU Sci Portal</div>
      <div class="modal-subtitle">بوابة طلاب كلية العلوم - تسجيل الدخول</div>

      <form onsubmit="handleSketchLogin(event)">
        <div class="sketch-input-group">
          <label class="sketch-label">رقم القيد / كود الطالب (Student ID):</label>
          <input type="text" class="sketch-input" required placeholder="Ex: 20261054" dir="ltr">
        </div>

        <div class="sketch-input-group">
          <label class="sketch-label">كلمة المرور (Password):</label>
          <input type="password" class="sketch-input" required placeholder="••••••••" dir="ltr">
        </div>

        <button type="submit" class="sketch-submit-btn">
          ENTER / تسجيل الدخول ➜
        </button>
      </form>

      <div class="sketch-quick-links">
        <div class="sketch-pill" onclick="alert('جاري فتح نتائج الامتحانات...')">📊 النتائج الدراسية</div>
        <div class="sketch-pill" onclick="alert('جاري فتح جدول المحاضرات...')">🗓️ جدول المحاضرات</div>
        <div class="sketch-pill" onclick="alert('جاري تحميل المقررات...')">📚 المقررات والكتب</div>
        <div class="sketch-pill" onclick="alert('جاري فتح شؤون الطلاب...')">🏛️ شؤون الطلاب</div>
      </div>

    </div>
  </div>

  <!-- Bottom Floating Toolbar -->
  <div class="top-toolbar">
    <button class="toolbar-btn" onclick="openSketchModal()">✏️ Login Modal</button>
    <button class="toolbar-btn" onclick="togglePaperBackground()">📄 Paper Mode</button>
  </div>

  <script>
    function openSketchModal() {
      document.getElementById('sketchModal').classList.add('active');
    }

    function closeSketchModal() {
      document.getElementById('sketchModal').classList.remove('active');
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'sketchModal') {
        closeSketchModal();
      }
    }

    function handleSketchLogin(e) {
      e.preventDefault();
      alert('🎉 مرحباً بك في بوابة طلاب كلية العلوم AzU Science Student Patrol!');
      closeSketchModal();
    }

    let isLinedPaper = false;
    function togglePaperBackground() {
      isLinedPaper = !isLinedPaper;
      if (isLinedPaper) {
        document.body.style.backgroundImage = 'repeating-linear-gradient(#fff, #fff 32px, #e1e7f0 33px)';
        document.body.style.backgroundSize = 'auto';
      } else {
        document.body.style.backgroundImage = 'radial-gradient(#d1d1d1 0.75px, transparent 0.75px)';
        document.body.style.backgroundSize = '24px 24px';
      }
    }
  </script>

</body>
</html>
