<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AzU Sci - Student Patrol</title>
  
  <!-- Google Fonts for Hand-drawn / Sketch / Crayon styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Finger+Paint&family=Permanent+Marker&family=Cabin+Sketch:wght@700&family=Caveat:wght@700&family=Gochi+Hand&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    :root {
      --main-ink: #000000;
      --paper-dot: #cfcfcf;
    }

    body {
      background-color: #ffffff;
      color: var(--main-ink);
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      font-family: 'Finger Paint', 'Permanent Marker', cursive, sans-serif;
      position: relative;
      background-image: radial-gradient(var(--paper-dot) 1px, transparent 1px);
      background-size: 22px 22px;
      display: flex;
      flex-direction: column;
    }

    /* Sketch SVG Filter */
    .sketch-effect {
      filter: url(#rough-filter);
    }

    /* Layout Wrapper */
    .canvas-container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      min-height: 100dvh;
      padding: 16px 24px 30px 24px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Header Section (AzU Sci at Top Right) */
    .header-section {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      padding-top: 8px;
      padding-bottom: 6px;
    }

    .brand-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: relative;
    }

    .brand-top-row {
      display: flex;
      align-items: center;
      gap: clamp(8px, 2vw, 14px);
    }

    .brand-azu {
      font-size: clamp(2.4rem, 8vw, 4.4rem);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--main-ink);
      transform: rotate(-1deg);
      text-shadow: 1px 1px 0px #333;
    }

    .brand-logo-circle {
      width: clamp(48px, 12vw, 72px);
      height: clamp(48px, 12vw, 72px);
      border: clamp(3px, 0.8vw, 5px) solid var(--main-ink);
      border-radius: 50% 46% 52% 48% / 48% 52% 48% 52%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: rotate(4deg);
      box-shadow: 0 0 0 1px var(--main-ink);
    }

    .logo-inner-text {
      font-size: clamp(0.85rem, 2.4vw, 1.25rem);
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: -0.5px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo-inner-text span:first-child {
      border-bottom: 2px solid var(--main-ink);
      padding-bottom: 1px;
    }
    .logo-inner-text span:last-child {
      padding-top: 1px;
    }

    .brand-sci {
      font-size: clamp(2.2rem, 7.5vw, 4rem);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: 1px;
      margin-top: 2px;
      transform: rotate(1deg);
      text-shadow: 1px 1px 0px #333;
    }

    /* Hand-drawn Divider Line */
    .sketch-divider {
      width: 100%;
      height: clamp(12px, 2.5vw, 20px);
      margin-top: 4px;
      margin-bottom: clamp(20px, 4vh, 45px);
    }

    /* Main Content Container */
    .main-grid {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: clamp(25px, 5vh, 50px);
      padding: 0 6px;
    }

    /* Left Hand-written Typography */
    .sketch-text-column {
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 1.5vw, 8px);
      width: 100%;
      text-align: left;
    }

    .sketch-line {
      font-size: clamp(2.4rem, 8.5vw, 4.8rem);
      font-weight: 900;
      line-height: 1.15;
      color: var(--main-ink);
      transform-origin: left center;
      display: block;
      white-space: nowrap;
      text-shadow: 0.5px 0.5px 0px rgba(0,0,0,0.8);
    }

    .line-welcome {
      transform: rotate(-1.5deg);
    }

    .line-to {
      transform: rotate(1deg);
      margin-left: clamp(6px, 2vw, 14px);
    }

    .line-azuscince {
      transform: rotate(-0.5deg);
      letter-spacing: 0.5px;
    }

    .line-student {
      transform: rotate(1.5deg);
      margin-left: clamp(8px, 2.2vw, 16px);
    }

    .line-patrol {
      transform: rotate(-1deg);
      letter-spacing: 1px;
    }

    /* Action Column: Arrow placed directly UNDER the text on Mobile */
    .sketch-action-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding-top: 10px;
    }

    .arrow-button {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 10px;
      outline: none;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 340px;
    }

    .arrow-button:hover, .arrow-button:focus {
      transform: scale(1.06) translateX(6px);
    }

    .arrow-button:active {
      transform: scale(0.96) translateX(10px);
    }

    .arrow-svg {
      width: 100%;
      max-width: 280px;
      height: auto;
      filter: drop-shadow(1px 2px 0px rgba(0,0,0,0.25));
    }

    .arrow-hint {
      font-family: 'Cairo', 'Caveat', cursive;
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 700;
      color: #222;
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* Desktop View: Keep side-by-side if screen is wide */
    @media (min-width: 820px) {
      .main-grid {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        align-items: center;
        gap: 30px;
      }
      .sketch-action-column {
        padding-top: 0;
      }
    }

    /* Interactive Hand-Drawn Sketch Modal */
    .sketch-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(3px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .sketch-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .sketch-modal {
      background: #ffffff;
      border: clamp(3px, 1vw, 5px) solid var(--main-ink);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      max-width: 480px;
      width: 100%;
      padding: clamp(22px, 5vw, 32px);
      box-shadow: 8px 10px 0px var(--main-ink);
      position: relative;
      transform: rotate(-1deg) scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .sketch-modal-overlay.active .sketch-modal {
      transform: rotate(-0.5deg) scale(1);
    }

    .modal-close-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 1.8rem;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Permanent Marker', cursive;
      color: var(--main-ink);
      line-height: 1;
      padding: 6px;
    }

    .modal-title {
      font-size: clamp(1.6rem, 5vw, 2.2rem);
      font-family: 'Permanent Marker', cursive;
      margin-bottom: 4px;
      color: var(--main-ink);
      text-align: center;
    }

    .modal-subtitle {
      font-family: 'Cairo', 'Caveat', cursive;
      font-size: clamp(0.95rem, 3vw, 1.15rem);
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .sketch-input-group {
      margin-bottom: 14px;
      text-align: right;
    }

    .sketch-label {
      display: block;
      font-family: 'Cairo', cursive;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #111;
    }

    .sketch-input {
      width: 100%;
      padding: 10px 14px;
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;
      border: 3px solid var(--main-ink);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      outline: none;
      background: #fafafa;
      box-shadow: 3px 3px 0px var(--main-ink);
      transition: all 0.2s;
    }

    .sketch-input:focus {
      background: #fff;
      box-shadow: 5px 5px 0px var(--main-ink);
    }

    .sketch-submit-btn {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: var(--main-ink);
      color: #ffffff;
      font-family: 'Cairo', 'Permanent Marker', cursive;
      font-size: 1.25rem;
      font-weight: 900;
      border: 3px solid var(--main-ink);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      cursor: pointer;
      box-shadow: 4px 5px 0px #555;
      transition: all 0.2s;
    }

    .sketch-submit-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }

    .sketch-quick-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 2px dashed var(--main-ink);
    }

    .sketch-pill {
      padding: 8px 10px;
      border: 2px solid var(--main-ink);
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
      background: #f4f4f4;
      font-family: 'Cairo', cursive;
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
    }

    .sketch-pill:active {
      background: #000;
      color: #fff;
    }
  </style>
</head>
<body class="sketch-effect">

  <!-- SVG Filter to create rough charcoal/crayon texture -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true">
    <defs>
      <filter id="rough-filter" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="canvas-container">
    
    <!-- TOP RIGHT: AzU Sci + Round Logo -->
    <header class="header-section">
      <div class="brand-container">
        
        <div class="brand-top-row">
          <div class="brand-azu">AzU</div>
          
          <!-- Round Logo Stamp with AzU inside -->
          <div class="brand-logo-circle">
            <div class="logo-inner-text">
              <span>Az</span>
              <span>U</span>
            </div>
          </div>
        </div>

        <div class="brand-sci">Sci</div>

      </div>
    </header>

    <!-- HORIZONTAL SKETCH DIVIDER LINE -->
    <svg class="sketch-divider" viewBox="0 0 1000 20" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <path d="M 0 10 Q 150 5, 300 12 T 600 7 T 850 13 T 1000 9" stroke="#000000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 5 11 Q 200 8, 450 12 T 750 9 T 995 11" stroke="#000000" stroke-width="2.5" opacity="0.8" stroke-linecap="round"/>
    </svg>

    <!-- MAIN BODY: Left Handwritten Text + Arrow Directly Underneath on Mobile -->
    <main class="main-grid">
      
      <!-- Handwritten text lines -->
      <div class="sketch-text-column">
        <span class="sketch-line line-welcome">Welcome</span>
        <span class="sketch-line line-to">to</span>
        <span class="sketch-line line-azuscince">AZUScince</span>
        <span class="sketch-line line-student">student</span>
        <span class="sketch-line line-patrol">patrol</span>
      </div>

      <!-- Arrow Button: Directly UNDER the text on mobile WITH Emojis -->
      <div class="sketch-action-column">
        
        <button class="arrow-button" onclick="openSketchModal()" aria-label="Enter Student Portal">
          
          <!-- Hand-drawn SVG Arrow pointing right -->
          <svg class="arrow-svg" viewBox="0 0 340 160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Arrow stem / shaft with multi-stroke texture -->
            <path d="M 15 90 Q 70 87, 150 92 T 280 88" stroke="#000000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 20 92 Q 100 89, 180 91 T 275 89" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
            
            <!-- Arrow top wing -->
            <path d="M 210 42 Q 245 65, 288 89" stroke="#000000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 215 45 Q 250 68, 285 87" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
            
            <!-- Arrow bottom wing -->
            <path d="M 225 138 Q 255 115, 288 89" stroke="#000000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 228 134 Q 258 111, 285 91" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
            
            <!-- Texture dots -->
            <circle cx="205" cy="38" r="2" fill="#000"/>
            <circle cx="220" cy="142" r="2" fill="#000"/>
            <circle cx="12" cy="91" r="1.5" fill="#000"/>
          </svg>

          <span class="arrow-hint">👉 اضغط هنا للدخول 👈</span>
        </button>

      </div>

    </main>

  </div>

  <!-- Interactive Hand-Drawn Sketch Modal (WITH EMOJIS) -->
  <div id="sketchModal" class="sketch-modal-overlay" onclick="handleOverlayClick(event)">
    <div class="sketch-modal">
      
      <button class="modal-close-btn" onclick="closeSketchModal()">✕</button>

      <div class="modal-title">✨ AzU Sci Portal ✨</div>
      <div class="modal-subtitle">🎓 بوابة طلاب كلية العلوم - تسجيل الدخول</div>

      <form onsubmit="handleSketchLogin(event)">
        <div class="sketch-input-group">
          <label class="sketch-label">رقم القيد / كود الطالب:</label>
          <input type="text" class="sketch-input" required placeholder="20261054" dir="ltr" inputmode="numeric">
        </div>

        <div class="sketch-input-group">
          <label class="sketch-label">كلمة المرور:</label>
          <input type="password" class="sketch-input" required placeholder="••••••••" dir="ltr">
        </div>

        <button type="submit" class="sketch-submit-btn">
          دخول البوابة 🚀
        </button>
      </form>

      <div class="sketch-quick-links">
        <div class="sketch-pill" onclick="alert('جاري فتح نتائج الامتحانات...')">📊 النتائج</div>
        <div class="sketch-pill" onclick="alert('جاري فتح جدول المحاضرات...')">🗓️ الجدول</div>
        <div class="sketch-pill" onclick="alert('جاري تحميل المقررات...')">📚 المقررات</div>
        <div class="sketch-pill" onclick="alert('جاري فتح شؤون الطلاب...')">🏛️ الشؤون</div>
      </div>

    </div>
  </div>

  <script>
    function openSketchModal() {
      document.getElementById('sketchModal').classList.add('active');
    }

    function closeSketchModal() {
      document.getElementById('sketchModal').classList.remove('active');
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'sketchModal') {
        closeSketchModal();
      }
    }

    function handleSketchLogin(e) {
      e.preventDefault();
      alert('🎉 مرحباً بك في بوابة طلاب كلية العلوم AzU Science Student Patrol! ✨');
      closeSketchModal();
    }
  </script>

</body>
</html>
